<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>おうちスーパー レジ</title><style>
*{box-sizing:border-box}body{font-family:system-ui,'Noto Sans JP',sans-serif;background:#f3f7f3;margin:0;color:#173629}header{background:#075c3b;color:white;padding:20px;text-align:center}h1{margin:0;font-size:26px}main{max-width:650px;margin:auto;padding:15px}.panel{background:white;border-radius:17px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px #0001}button,input{font:inherit}button{background:#08764c;color:white;border:0;border-radius:10px;padding:13px 16px;cursor:pointer}button.secondary{background:#e5f2e9;color:#075c3b}button:disabled{opacity:.5}input{padding:12px;border:1px solid #aaa;border-radius:8px;max-width:100%}input[type=url]{width:100%}#reader{width:100%;min-height:0;overflow:hidden}#reader video{max-width:100%}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.muted{color:#666;font-size:14px}.item{padding:10px 0;border-bottom:1px solid #ddd}.price{font-weight:bold;color:#08764c}.total{font-size:32px;font-weight:bold;color:#08764c}.hidden{display:none}.notice{background:#eaf6ef;padding:10px;border-radius:8px}#status{font-weight:bold}select{font:inherit;padding:10px;max-width:100%;border-radius:8px}label{display:block;margin:10px 0 5px}#picker{width:100%}</style></head><body><header><h1>🏪 おうちスーパー</h1><div>ピッ！と読み取ってお買い物</div></header><main>
<section class="panel" id="config"><h2>最初の設定（1回だけ）</h2><p class="muted">Google Apps Scriptのレジ用URL（末尾が /exec）を貼り付けてください。商品管理URLの ?mode=admin は取り除きます。</p><input type="url" id="apiUrl" placeholder="https://script.google.com/macros/s/.../exec"><div style="margin-top:10px"><button id="connect">商品データを読み込む</button></div><p id="connectStatus" class="muted"></p><p class="muted">URLはこの端末のブラウザ内に保存されます。商品情報は公開URLから取得します。</p></section>
<section class="panel"><h2>📷 商品のQRコードを読み取ろう</h2><div class="row"><button id="start">カメラを起動</button><button id="stop" class="secondary" disabled>カメラを停止</button></div><div id="reader"></div><p id="status" aria-live="polite">まず商品データを読み込んでください。</p><p class="muted">同じ商品を続けて読み取れます。読み取り後は約1.5秒間、重複登録を防ぎます。</p></section>
<section class="panel"><h2>📦 商品を手動で追加</h2><select id="picker"><option value="">商品を選択</option></select> <button id="manual">追加</button></section>
<section class="panel"><h2>🛍️ お買い物カゴ</h2><div id="cart">まだ商品がありません。</div><div class="row" style="margin-top:15px"><b>合計金額</b><span class="total" id="total">0円</span></div><label for="paid">お預かり金額</label><input id="paid" type="number" inputmode="numeric" min="0" placeholder="例：1000"><p id="change">お釣り：—</p><button id="clear" class="secondary">次のお客さん（カゴを空にする）</button></section></main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>
'use strict';const $=id=>document.getElementById(id);let products=[],cart=[],scanner=null,active=false,lastCode='',lastAt=0;const yen=n=>Number(n).toLocaleString('ja-JP')+'円';const status=t=>$('status').textContent=t;
function getUrl(){let u=$('apiUrl').value.trim();try{let parsed=new URL(u);if(parsed.protocol!=='https:'||parsed.hostname!=='script.google.com'||!/^\/macros\/s\/[^/]+\/exec\/?$/.test(parsed.pathname))throw Error();return parsed.origin+parsed.pathname.replace(/\/$/,'');}catch(e){throw new Error('Apps Scriptの /exec で終わるURLを入力してください。');}}
function loadProducts(){let url;try{url=getUrl()}catch(e){$('connectStatus').textContent=e.message;return} $('connectStatus').textContent='読み込み中…';const cb='ouchiProducts_'+Date.now();const script=document.createElement('script');let done=false;const timeout=setTimeout(()=>finish('通信がタイムアウトしました。Code.gsの更新と再デプロイを確認してください。'),12000);function finish(err,data){if(done)return;done=true;clearTimeout(timeout);delete window[cb];script.remove();if(err){$('connectStatus').textContent=err;status(err);return}if(!Array.isArray(data)){finish('商品データの形式が違います。');return}products=data.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&Number.isFinite(Number(p.price))).map(p=>({id:p.id,name:p.name,price:Number(p.price)}));localStorage.setItem('ouchi_api_url',url);$('connectStatus').textContent=products.length+'件の商品を読み込みました。';status('カメラを起動してQRコードをかざしてください。');$('picker').innerHTML='<option value="">商品を選択</option>';products.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=p.name+'（'+yen(p.price)+'）';$('picker').appendChild(o)});$('config').classList.add('hidden')}
window[cb]=payload=>{if(payload&&payload.error){finish(payload.error);return}if(!Array.isArray(payload)){finish('商品データの形式が違います。');return}finish(null,payload)};script.onerror=()=>finish('通信できません。URLと公開設定を確認してください。');script.src=url+'?mode=api&callback='+encodeURIComponent(cb);document.head.appendChild(script)}
function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=1000;g.gain.value=.12;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.11);o.onended=()=>ctx.close()}catch(e){}}
function add(id){const p=products.find(x=>x.id===String(id).trim());if(!p){status('登録されていない商品コードです：'+String(id).slice(0,40));return false}const c=cart.find(x=>x.id===p.id);if(c)c.qty++;else cart.push({...p,qty:1});render();status('✓ '+p.name+' '+yen(p.price)+' を追加しました！');beep();if(navigator.vibrate)navigator.vibrate(80);return true}
function render(){const el=$('cart');el.replaceChildren();if(!cart.length)el.textContent='まだ商品がありません。';cart.forEach(c=>{const r=document.createElement('div');r.className='row item';const label=document.createElement('span');label.textContent=c.name+'　'+yen(c.price)+' × '+c.qty;const controls=document.createElement('span');const minus=document.createElement('button');minus.className='secondary';minus.textContent='−';minus.onclick=()=>qty(c.id,-1);const plus=document.createElement('button');plus.textContent='＋';plus.onclick=()=>qty(c.id,1);controls.append(minus,plus);r.append(label,controls);el.appendChild(r)});let total=cart.reduce((s,c)=>s+c.price*c.qty,0);$('total').textContent=yen(total);const paid=$('paid').value;$('change').textContent=paid===''?'お釣り：—':Number(paid)>=total?'お釣り：'+yen(Number(paid)-total):'あと '+yen(total-Number(paid))+' 必要です'}
function qty(id,d){const c=cart.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x!==c);render()}
async function start(){if(active)return;if(!products.length){status('先に商品データを読み込んでください。');$('config').classList.remove('hidden');return}if(typeof Html5Qrcode==='undefined'){status('読み取りライブラリを読み込めません。インターネット接続を確認してください。');return}try{scanner=new Html5Qrcode('reader',{verbose:false});status('カメラを起動中…');await scanner.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>{let size=Math.min(280,Math.floor(Math.min(w,h)*.75));return{width:size,height:size}}},decoded=>{const now=Date.now();if(decoded===lastCode&&now-lastAt<1500)return;lastCode=decoded;lastAt=now;add(decoded)},()=>{});active=true;$('start').disabled=true;$('stop').disabled=false;status('QRコードを枠の中にかざしてください。')}catch(e){status('カメラを起動できません：'+(e?.message||e));scanner=null;active=false}}
async function stop(){if(!scanner)return;try{if(active)await scanner.stop();scanner.clear()}catch(e){}scanner=null;active=false;$('start').disabled=false;$('stop').disabled=true;status('カメラを停止しました。')}
$('connect').onclick=loadProducts;$('start').onclick=start;$('stop').onclick=stop;$('manual').onclick=()=>{if($('picker').value)add($('picker').value)};$('paid').oninput=render;$('clear').onclick=()=>{if(cart.length&&!confirm('カゴを空にして次のお客さんに進みますか？'))return;cart=[];$('paid').value='';render();status('次のお客さん、いらっしゃいませ！')};const saved=localStorage.getItem('ouchi_api_url');if(saved){$('apiUrl').value=saved;loadProducts()}
</script></body></html>
